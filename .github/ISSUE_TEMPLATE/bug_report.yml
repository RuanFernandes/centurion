name: Bug report
description: Report a reproducible problem in Centurion
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please remove credentials, workspace paths, tokens, and private project data before submitting.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or abc1234
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Tell us exactly what you did and what happened.
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant diagnostics
      description: Redact tokens, cookies, secrets, private paths, and project content.
      render: text
